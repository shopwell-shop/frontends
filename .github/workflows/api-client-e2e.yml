name: API Client E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-store-api:
    name: API client against live Store API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHOPWELL_STORE_API_URL: ${{ vars.STOREFRONT_API_URL }}
      SHOPWELL_STORE_API_TOKEN: ${{ secrets.STOREFRONT_ACCESS_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Verify Store API configuration
        run: |
          test -n "$SHOPWELL_STORE_API_URL"
          test -n "$SHOPWELL_STORE_API_TOKEN"

      - name: Run live API client tests
        run: pnpm --filter @shopwell/api-client test:e2e
